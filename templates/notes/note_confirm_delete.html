{% extends 'base.html' %}

{% block title %}Удаление заметки{% endblock %}

{% block content %}
<div class="container fade-in">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Подтверждение удаления</h4>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить заметку <strong>"{{ note.title }}"</strong>?</p>
                    <p class="text-danger">Это действие нельзя отменить!</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'note_detail' note.id %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Да, удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
